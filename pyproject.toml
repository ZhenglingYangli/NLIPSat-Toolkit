[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nlipsat"
version = "0.1.0"
description = "Python API wrapper for the NLIPSat research toolkit"
requires-python = ">=3.10"
dependencies = [
    "python-sat[pblib,aiger]",
    "z3-solver",
]

[tool.setuptools]
packages = ["nlipsat"]
